# yaml-language-server: $schema=https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json
$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json
metadata:
  winget:
    processor:
      identifier: dscv3
resources:
  - type: Microsoft.Windows/Registry
    name: DisableBraveRewards
    metadata:
      winget:
        securityContext: elevated
    properties:
      keyPath: 'HKLM\Software\Policies\BraveSoftware\Brave'
      valueName: 'BraveRewardsDisabled'
      valueData:
        DWord: 1
      _exist: true

  - type: Microsoft.Windows/Registry
    name: DisableBraveWallet
    metadata:
      winget:
        securityContext: elevated
    properties:
      keyPath: 'HKLM\Software\Policies\BraveSoftware\Brave'
      valueName: 'BraveWalletDisabled'
      valueData:
        DWord: 1
      _exist: true

  - type: Microsoft.Windows/Registry
    name: DisableBraveNews
    metadata:
      winget:
        securityContext: elevated
    properties:
      keyPath: 'HKLM\Software\Policies\BraveSoftware\Brave'
      valueName: 'BraveNewsDisabled'
      valueData:
        DWord: 1
      _exist: true

  - type: Microsoft.Windows/Registry
    name: DisableBraveTalk
    metadata:
      winget:
        securityContext: elevated
    properties:
      keyPath: 'HKLM\Software\Policies\BraveSoftware\Brave'
      valueName: 'BraveTalkDisabled'
      valueData:
        DWord: 1
      _exist: true

  - type: Microsoft.Windows/Registry
    name: DisableBraveWaybackMachine
    metadata:
      winget:
        securityContext: elevated
    properties:
      keyPath: 'HKLM\Software\Policies\BraveSoftware\Brave'
      valueName: 'BraveWaybackMachineEnabled'
      valueData:
        DWord: 0
      _exist: true

  - type: Microsoft.Windows/Registry
    name: DisableBraveP3ATelemetry
    metadata:
      winget:
        securityContext: elevated
    properties:
      keyPath: 'HKLM\Software\Policies\BraveSoftware\Brave'
      valueName: 'BraveP3AEnabled'
      valueData:
        DWord: 0
      _exist: true

  - type: Microsoft.Windows/Registry
    name: DisableBraveStatsPing
    metadata:
      winget:
        securityContext: elevated
    properties:
      keyPath: 'HKLM\Software\Policies\BraveSoftware\Brave'
      valueName: 'BraveStatsPingEnabled'
      valueData:
        DWord: 0
      _exist: true

  - type: Microsoft.Windows/Registry
    name: DisableBraveDataCollection
    metadata:
      winget:
        securityContext: elevated
    properties:
      keyPath: 'HKLM\Software\Policies\BraveSoftware\Brave'
      valueName: 'UrlKeyedAnonymizedDataCollectionEnabled'
      valueData:
        DWord: 0
      _exist: true

  - type: Microsoft.Windows/Registry
    name: DisableBraveExtendedReporting
    metadata:
      winget:
        securityContext: elevated
    properties:
      keyPath: 'HKLM\Software\Policies\BraveSoftware\Brave'
      valueName: 'SafeBrowsingExtendedReportingEnabled'
      valueData:
        DWord: 0
      _exist: true

  - type: Microsoft.Windows/Registry
    name: DisableBraveMetricsReporting
    metadata:
      winget:
        securityContext: elevated
    properties:
      keyPath: 'HKLM\Software\Policies\BraveSoftware\Brave'
      valueName: 'MetricsReportingEnabled'
      valueData:
        DWord: 0
      _exist: true

  - type: Microsoft.Windows/Registry
    name: DisableBraveWebDiscovery
    metadata:
      winget:
        securityContext: elevated
    properties:
      keyPath: 'HKLM\Software\Policies\BraveSoftware\Brave'
      valueName: 'BraveWebDiscoveryEnabled'
      valueData:
        DWord: 0
      _exist: true

  - type: Microsoft.Windows/Registry
    name: DisableBraveAIChat
    metadata:
      winget:
        securityContext: elevated
    properties:
      keyPath: 'HKLM\Software\Policies\BraveSoftware\Brave'
      valueName: 'BraveAIChatEnabled'
      valueData:
        DWord: 0
      _exist: true

  - type: Microsoft.Windows/Registry
    name: DisableBraveVPN
    metadata:
      winget:
        securityContext: elevated
    properties:
      keyPath: 'HKLM\Software\Policies\BraveSoftware\Brave'
      valueName: 'BraveVPNDisabled'
      valueData:
        DWord: 1
      _exist: true

  - type: Microsoft.Windows/Registry
    name: DisableBraveTor
    metadata:
      winget:
        securityContext: elevated
    properties:
      keyPath: 'HKLM\Software\Policies\BraveSoftware\Brave'
      valueName: 'TorDisabled'
      valueData:
        DWord: 1
      _exist: true

  - type: Microsoft.Windows/Registry
    name: DisableBraveSpeedreader
    metadata:
      winget:
        securityContext: elevated
    properties:
      keyPath: 'HKLM\Software\Policies\BraveSoftware\Brave'
      valueName: 'BraveSpeedreaderEnabled'
      valueData:
        DWord: 0
      _exist: true

  - type: Microsoft.Windows/Registry
    name: DisableBravePasswordManager
    metadata:
      winget:
        securityContext: elevated
    properties:
      keyPath: 'HKLM\Software\Policies\BraveSoftware\Brave'
      valueName: 'PasswordManagerEnabled'
      valueData:
        DWord: 0
      _exist: true

  - type: Microsoft.Windows/Registry
    name: DisableBravePasswordManagerPasskeys
    metadata:
      winget:
        securityContext: elevated
    properties:
      keyPath: 'HKLM\Software\Policies\BraveSoftware\Brave'
      valueName: 'PasswordManagerPasskeysEnabled'
      valueData:
        DWord: 0
      _exist: true

  - type: Microsoft.Windows/Registry
    name: DisableBraveAutoplay
    metadata:
      winget:
        securityContext: elevated
    properties:
      keyPath: 'HKLM\Software\Policies\BraveSoftware\Brave'
      valueName: 'AutoplayAllowed'
      valueData:
        DWord: 0
      _exist: true

  - type: Microsoft.Windows/Registry
    name: DisableBraveAutofillAddress
    metadata:
      winget:
        securityContext: elevated
    properties:
      keyPath: 'HKLM\Software\Policies\BraveSoftware\Brave'
      valueName: 'AutofillAddressEnabled'
      valueData:
        DWord: 0
      _exist: true

  - type: Microsoft.Windows/Registry
    name: DisableBraveAutofillCreditCard
    metadata:
      winget:
        securityContext: elevated
    properties:
      keyPath: 'HKLM\Software\Policies\BraveSoftware\Brave'
      valueName: 'AutofillCreditCardEnabled'
      valueData:
        DWord: 0
      _exist: true