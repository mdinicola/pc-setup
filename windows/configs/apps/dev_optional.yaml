# yaml-language-server: $schema=https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json
$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json
metadata:
  winget:
    processor:
      identifier: dscv3
resources:
  - type: Microsoft.WinGet/Package
    name: InstallAwsSamCli
    metadata:
      winget:
        securityContext: elevated
    properties:
      id: Amazon.SAM-CLI
      source: winget

  - type: Microsoft.WinGet/Package
    name: InstallDocker
    metadata:
      winget:
        securityContext: elevated
    properties:
      id: Docker.DockerDesktop
      source: winget

  - type: Microsoft.WinGet/Package
    name: InstallDBeaver
    metadata:
      winget:
        securityContext: elevated
    properties:
      id: DBeaver.DBeaver.Community
      source: winget

  - type: Microsoft.WinGet/Package
    name: InstallLocalStack
    metadata:
      winget:
        securityContext: elevated
    properties:
      id: LocalStack.localstack-cli
      source: winget