---
- name: Set git settings
  ansible.builtin.import_tasks: 
    file: git_settings.yml
  tags:
    - git_settings

- name: Set vscode settings
  ansible.builtin.import_tasks: 
    file: vscode_settings.yml
  tags:
    - vscode

- name: Set opentofu settings
  ansible.builtin.import_tasks: 
    file: mise_tool_settings.yml
  vars:
    mise_tool: opentofu
  tags:
    - opentofu

- name: Set claude settings
  ansible.builtin.import_tasks: 
    file: mise_tool_settings.yml
  vars:
    mise_tool: claude
  tags:
    - claude

- name: Set codex settings
  ansible.builtin.import_tasks: 
    file: mise_tool_settings.yml
  vars:
    mise_tool: codex
  tags:
    - codex