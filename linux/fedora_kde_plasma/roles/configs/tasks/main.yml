---
- name: Set clipboard configurations
  community.general.kdeconfig:
    path: ~/.config/klipperrc
    values:
      - group: General
        key: KeepClipboardContents # disable clipboard history
        bool_value: false
      - group: General
        key: SelectionTextOnly # Only save text selections in history when explicitly copied
        bool_value: false
      - group: General
        key: SyncClipboards # copy on select
        bool_value: true
  tags:
    - clipboard
    - klipper

- name: Set dolphin configurations
  ansible.builtin.include_tasks: 
    file: kde_dolphin.yml
    apply:
      tags:
        - dolphin
        - file_explorer    
  tags:
    - dolphin
    - file_explorer