---
- name: Enable RPM Fusion
  ansible.builtin.dnf:
    name:
      - "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
      - "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
    disable_gpg_check: true
    state: present
  become: yes
  tags:
    - packages
    - apps

- name: Install dnf plugins core
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present
  become: yes

- name: Add dnf repositories
  ansible.builtin.import_tasks: 
    file: repositories.yml
  tags:
    - packages
    - apps

- name: Install Packages
  ansible.builtin.import_tasks: 
    file: packages.yml
  tags:
    - packages
    - apps

- name: Install Docker
  ansible.builtin.import_tasks: 
    file: docker.yml
  tags:
    - docker

- name: Install Mise
  ansible.builtin.import_tasks: 
    file: mise.yml
  tags:
    - mise
    - tools

- name: Configure OpenTofu
  ansible.builtin.import_tasks: 
    file: "{{ playbook_dir }}/../../common/tasks/opentofu_settings.yml"
  tags:
    - opentofu
    - tools

- name: Configure Settings and Preferences
  ansible.builtin.import_tasks: 
    file: settings.yml
  tags:
    - settings
    - preferences