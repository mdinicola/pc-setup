---
- name: Run fedora common setup
  ansible.builtin.import_tasks: 
    file: "{{ playbook_dir }}/../../fedora_common/tasks/main.yml"
  tags:
    - fedora
    - common_setup

- name: Install KDE Packages
  ansible.builtin.import_tasks: 
    file: packages.yml
  tags:
    - packages
    - apps

- name: Configure settings and preferences
  ansible.builtin.import_tasks: 
    file: settings.yml
  tags:
    - settings
    - preferences