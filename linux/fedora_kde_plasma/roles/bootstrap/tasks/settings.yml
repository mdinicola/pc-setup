---
- name: Set dnf settings
  ansible.builtin.import_tasks: 
    file: dnf_settings.yml
  tags:
    - dnf_settings

- name: Set clipboard preferences
  community.general.kdeconfig:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/klipperrc"
    values:
      - group: General
        key: KeepClipboardContents # disable clipboard history
        bool_value: false
      - group: General
        key: SelectionTextOnly # Only save text selections in history when explicitly copied
        bool_value: false
  tags:
    - clipboard
    - klipper

- name: Set dolphin preferences
  community.general.kdeconfig:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/dolphinrc"
    values:
      - group: General
        key: BrowseThroughArchives # browse zip archives without extracting
        bool_value: true
  tags:
    - dolphin
    - file_explorer

- name: Set git settings
  ansible.builtin.import_tasks: 
    file: "{{ playbook_dir }}/../../common/tasks/git_settings.yml"
  tags:
    - git_settings

- name: Set vscode settings
  ansible.builtin.import_tasks: 
    file: "{{ playbook_dir }}/../../common/tasks/vscode_settings.yml"
  tags:
    - vscode

- name: Set supabase settings
  ansible.builtin.import_tasks: 
    file: "{{ playbook_dir }}/../../common/tasks/supabase_settings.yml"
  tags:
    - supabase