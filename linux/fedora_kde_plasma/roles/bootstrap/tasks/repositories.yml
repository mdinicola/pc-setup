---
- name: Add Brave Browser repository
  ansible.builtin.get_url:
    url: https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
    dest: /etc/yum.repos.d/brave-browser.repo
    mode: '0644'
  become: yes

- name: Import Microsoft GPG key
  ansible.builtin.rpm_key:
    key: https://packages.microsoft.com/keys/microsoft.asc
  become: yes

- name: Add VS Code repository
  ansible.builtin.yum_repository:
    name: code
    description: Visual Studio Code
    baseurl: https://packages.microsoft.com/yumrepos/vscode
    gpgcheck: true
    gpgkey: https://packages.microsoft.com/keys/microsoft.asc
    file: vscode
    enabled: true
  become: yes

- name: Add Flathub repository
  community.general.flatpak_remote:
    name: flathub
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
    state: present
  become: yes

- name: Add SourceGit repository
  ansible.builtin.yum_repository:
    name: gitea-yataro
    description: yataro - Codeberg.org
    baseurl: https://codeberg.org/api/packages/yataro/rpm
    gpgcheck: false # sourcegit package is not signed
    gpgkey: https://codeberg.org/api/packages/yataro/rpm/repository.key
    file: sourcegit
    enabled: true
  become: yes

- name: Add Kopia repository
  ansible.builtin.yum_repository:
    name: Kopia
    description: Kopia
    baseurl: http://packages.kopia.io/rpm/stable/$basearch/
    gpgcheck: true
    gpgkey: https://kopia.io/signing-key
    file: kopia
    enabled: true
  become: yes

