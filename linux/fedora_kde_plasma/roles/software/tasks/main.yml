---
- name: Enable RPM Fusion
  ansible.builtin.dnf:
    name:
      - "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
      - "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
    disable_gpg_check: true
    state: present
  become: yes
  tags:
    - packages
    - apps

- name: Install dnf plugins core
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present
  become: yes

- name: Add dnf repositories
  ansible.builtin.include_tasks: 
    file: repositories.yml
    apply:
      become: yes
      tags:
        - packages
        - apps
  tags:
    - packages
    - apps

- name: Install Packages
  ansible.builtin.include_tasks: 
    file: packages.yml
    apply:
      become: yes
      tags:
        - packages
        - apps
  tags:
    - packages
    - apps

- name: Install Docker
  ansible.builtin.include_tasks: 
    file: docker.yml
    apply:
      become: yes
      tags:
        - docker
  tags:
    - docker

- name: Install Mise
  ansible.builtin.include_tasks: 
    file: mise.yml
    apply:
      tags:
        - mise
        - tools
  tags:
    - mise
    - tools

- name: Configure OpenTofu
  ansible.builtin.include_tasks: 
    file: opentofu.yml
    apply:
      tags:
        - opentofu
        - tools
  tags:
    - opentofu
    - tools