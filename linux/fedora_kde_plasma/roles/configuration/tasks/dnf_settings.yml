---
- name: Enable fastest mirror in dnf config
  ansible.builtin.ini_file:
    path: /etc/dnf/dnf.conf
    section: main
    option: fastestmirror
    value: 'True'

- name: Set parallel downloads in dnf config
  ansible.builtin.ini_file:
    path: /etc/dnf/dnf.conf
    section: main
    option: max_parallel_downloads
    value: '10'

- name: Set default to yes in dnf config
  ansible.builtin.ini_file:
    path: /etc/dnf/dnf.conf
    section: main
    option: defaultyes
    value: 'True'