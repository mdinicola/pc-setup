---
- name: Add Flathub repository
  community.general.flatpak_remote:
    name: flathub
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
    state: present
  become: yes

- name: Install GNOME desktop packages
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: latest
  become: yes
  loop:
    - "@gnome-desktop"
  tags:
    - gnome_desktop
    - gnome

- name: Run GNOME bootstrap role
  ansible.builtin.import_role: 
    file: "{{ playbook_dir }}/../../fedora_gnome/roles/bootstrap"
  tags:
    - gnome_bootstrap
    - gnome