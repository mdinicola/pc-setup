---
- name: Install common packages
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present
  become: yes
  loop:
    - ca-certificates
    - cifs-utils
    - curl
    - git
    - xz
    - gnupg2
    - nmap
    - jq

- name: Install rpm fusion packages
  ansible.builtin.dnf:
    name: "{{ item }}"
    allowerasing: yes
    state: present
  become: yes
  loop:
    - ffmpeg

- name: Update dnf groups to latest
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: latest
  become: yes
  loop:
    - "@multimedia"

- name: Install applications and tools
  ansible.builtin.dnf:
    name: "{{ item }}"  
    state: present
  become: yes
  loop:
    - brave-origin
    - code # VS Code
    - vlc
    - sourcegit
    - kopia-ui

- name: Install Flatpak Applications
  ansible.builtin.import_tasks: 
    file: "{{ playbook_dir }}/../../common/tasks/flatpaks.yml"
  tags:
    - flatpak
    - flathub
    - apps