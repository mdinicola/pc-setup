---
- name: Limit all access to tcp port 22
  community.general.ufw:
    rule: limit
    port: '22'
    proto: tcp

- name: Allow all access to tcp port 80
  community.general.ufw:
    rule: allow
    port: '80'
    proto: tcp

- name: Allow all access to tcp port 443
  community.general.ufw:
    rule: allow
    port: '443'
    proto: tcp

- name: Deny default incoming
  community.general.ufw:
    default: deny
    direction: incoming

- name: Allow default outgoing
  community.general.ufw:
    default: allow
    direction: outgoing

- name: Enable firewall
  community.general.ufw:
    state: enabled