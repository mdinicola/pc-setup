---
- name: Add VSCodium APT repository
  ansible.builtin.deb822_repository:
    name: vscodium
    types: [deb]
    uris: https://download.vscodium.com/debs
    signed_by: https://gitlab.com/paulcarroty/vscodium-deb-rpm-repo/raw/master/pub.gpg
    architectures: amd64
    suites: [vscodium]
    components: [main]
    state: present
    enabled: yes
  notify:
    - Update APT cache

- name: Add Docker Module Repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: "https://download.docker.com/linux/ubuntu"
    signed_by: "https://download.docker.com/linux/ubuntu/gpg"
    architectures: amd64
    suites: ["{{ ubuntu_codename | lower }}"]
    components: [stable]
    state: present
    enabled: yes
  notify:
    - Update APT cache

- name: Add HashiCorp APT repository
  ansible.builtin.deb822_repository:
    name: hashicorp
    types: [deb]
    uris: https://apt.releases.hashicorp.com
    signed_by: https://apt.releases.hashicorp.com/gpg
    architectures: amd64
    suites: ["{{ ubuntu_codename | lower }}"]
    components: [main]
    state: present
    enabled: yes
  notify:
    - Update APT cache

- name: Add Brave Browser APT repository
  ansible.builtin.deb822_repository:
    name: brave
    types: [deb]
    uris: https://brave-browser-apt-release.s3.brave.com/
    signed_by: https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
    suites: [stable]
    components: [main]
    state: present
    enabled: yes
  notify:
    - Update APT cache

- meta: flush_handlers