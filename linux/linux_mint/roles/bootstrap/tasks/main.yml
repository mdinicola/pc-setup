---
- name: Set Ubuntu Codename
  set_fact:
    ubuntu_codename: "{{ lookup('ini', 'UBUNTU_CODENAME', type='properties', file='/etc/os-release') }}"

- name: Uninstall default APT packages
  ansible.builtin.apt:
    name: "{{ item }}"
    state: absent
    purge: true
  become: yes
  loop:
    - thunderbird
  tags:
    - packages
    - apps

- name: Clean APT
  ansible.builtin.apt:
    clean: yes
  become: yes
  tags:
    - packages
    - apps

- name: Autoremove APT
  ansible.builtin.apt:
    autoremove: yes
  become: yes
  tags:
    - packages
    - apps

- name: Add APT repositories
  ansible.builtin.import_tasks: 
    file: repositories.yml
  tags:
    - packages
    - apps

- name: Install Packages
  ansible.builtin.import_tasks: 
    file: packages.yml
  tags:
    - packages
    - apps

- name: Install Docker
  ansible.builtin.import_tasks: 
    file: docker.yml
  tags:
    - docker

- name: Install Mise
  ansible.builtin.import_tasks: 
    file: mise.yml
  tags:
    - mise
    - tools

- name: Configure OpenTofu
  ansible.builtin.import_tasks: 
    file: "{{ playbook_dir }}/../../common/tasks/opentofu_settings.yml"
  tags:
    - opentofu
    - tools

- name: Configure Settings and Preferences
  ansible.builtin.import_tasks: 
    file: settings.yml
  tags:
    - settings
    - preferences