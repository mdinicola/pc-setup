---
- name: Install general packages
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  become: yes
  loop:
    - apt-transport-https
    - ca-certificates
    - cifs-utils
    - curl
    - extrepo
    - xz-utils
    - gnupg
    - software-properties-common
    - ffmpeg
    - git
    - jq

- name: Install applications and tools
  ansible.builtin.apt:
    name: "{{ item }}"  
    state: present
  become: yes
  loop:
    - brave-origin
    - kate
    - code # Visual Studio Code
    - vlc
    - qdirstat
    - flameshot
    - kopia-ui
    - sourcegit

- name: Install cross-distro packages and applications
  ansible.builtin.import_tasks: 
    file: "{{ playbook_dir }}/../../common/tasks/packages.yml"
  tags:
    - packages
    - apps
    - flatpak