---
- name: Install GNOME applications and tools
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present
  become: yes
  loop:
    - gnome-tweaks
    - file-roller
    - baobab

- name: Install flatpak applications
  community.general.flatpak:
    name: "{{ item }}"
    state: present
  become: yes
  loop:
    - com.mattjakeman.ExtensionManager